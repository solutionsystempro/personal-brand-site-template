<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Default SEO tags. These are what link previews (LinkedIn, X, Slack) see,
      because crawlers do not run JavaScript. Update them to match
      src/content.ts > site. Each page also sets its own title and description
      at runtime from src/content.ts > seo.
    -->
    <title>Your Name | Helping [who] get [result]</title>
    <meta name="description" content="Your Name helps [who] get [result] without [pain]. Replace this description in index.html and src/content.ts." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Your Name" />
    <meta property="og:title" content="Your Name | Helping [who] get [result]" />
    <meta property="og:description" content="Your Name helps [who] get [result] without [pain]." />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your Name | Helping [who] get [result]" />
    <meta name="twitter:description" content="Your Name helps [who] get [result] without [pain]." />
    <meta name="twitter:image" content="/og-image.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript enabled to display.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
